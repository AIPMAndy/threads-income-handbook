name: PR quality and client-side regression
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generated site is synchronized with source
        run: python3 scripts/build.py --check
      - name: Validate HTML links, metadata, and source mapping
        run: python3 scripts/check.py
      - name: Syntax-check live deployment gate
        run: python3 -m py_compile scripts/live_verify.py
      - name: Validate local-only business logic
        run: node scripts/js_logic_check.js
      - name: Install headless Chromium
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Real Chromium responsive and workbench regression
        run: python3 scripts/browser_check.py
      - name: Archive visual regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threads-browser-screenshots
          path: artifacts/browser/*.png
          if-no-files-found: ignore
